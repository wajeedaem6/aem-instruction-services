<div data-sly-use.model="com.pabpalac.core.models.customcarouselmodel.CustomCarouselModel"
     data-sly-test.hasContent="${!model.carouselItems.empty}"
     class="cmp-custom_carousel">
    <div class="carousel-inner"
         data-sly-list.carouselItem="${model.carouselItems}">
        <div class="carousel-item${carouselItemList.first ? ' active' : ''}">
            <img src="${carouselItem.asset}" alt="${carouselItem.altText}"/>
            ${carouselItem.text}
            <h2>${carouselItem.heroText}</h2>
            <a href="${carouselItem.cta}">${carouselItem.ctaText}</a>
        </div>
    </div>
    <button class="carousel-control prev">&#10094;</button>
    <button class="carousel-control next">&#10095;</button>
</div>
<sly data-sly-use.tmp="core/wcm/components/commons/v1/templates.html"
     data-sly-call="${tmp.placeholder @ isEmpty=!hasContent, classAppend='cmp-customcarousel'}"/>
